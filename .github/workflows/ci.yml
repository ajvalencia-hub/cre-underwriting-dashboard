name: CI

on:
  push:
  pull_request:

# One live run per ref: a newer push to the same branch / PR cancels the run
# still in progress instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOffice + Tesseract (parity, memo PDF, OCR paths)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-writer tesseract-ocr poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run pytest (includes Excel parity via LibreOffice)
        working-directory: backend
        run: python -m pytest tests -q
      - name: Parity CLI (divergence table — LibreOffice is mandatory here, no silent SKIPPED)
        working-directory: backend
        run: python -m tests.parity.run --require-libreoffice
      # Advisory only: a freshly published CVE against a pinned dependency
      # must not block unrelated PRs — the step annotates the run and
      # Dependabot proposes the bump. Flip continue-on-error off once the
      # current pins have been triaged.
      - name: pip-audit (advisory, non-blocking)
        continue-on-error: true
        run: pip-audit

  # Roadmap #32: ruff and mypy (config in backend/pyproject.toml). mypy skips
  # the modules listed under its ratchet override until they're cleaned up.
  backend-lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend + dev dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Mypy
        working-directory: backend
        # Check as the interpreter CI installs: pyproject's 3.10 matches the
        # local venv, but numpy's current stubs use 3.12-only syntax.
        run: mypy --python-version 3.12

  frontend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test
      # Advisory only, same reasoning as pip-audit above.
      - name: npm audit (advisory, non-blocking)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  # Roadmap #22: the frontend's generated API types must match the backend's
  # OpenAPI schema (regenerate with `npm run gen:api` in frontend/). The
  # compile-time contract in src/types/apiContract.ts is checked by the
  # frontend job's typecheck.
  api-contract:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate API types
        run: PYTHON=python ./scripts/gen-api-types.sh
      - name: Generated types are committed and current
        run: git diff --exit-code frontend/src/types/api.gen.ts

  # J16: catch Dockerfile / compose rot — validate the compose file, build the
  # image, then boot it once and poll /api/health (up to 60 s).
  docker:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config
      - name: Build the image
        run: docker build -t cre-dashboard:ci .
      - name: Smoke-test the image (/api/health)
        run: |
          docker run -d --name cre-smoke -p 8000:8000 cre-dashboard:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo; echo "healthy after ~$((i * 2))s"
              docker rm -f cre-smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/health never answered within 60 s"
          docker logs cre-smoke
          docker rm -f cre-smoke
          exit 1

  # Separate job so unit-test feedback stays fast — one chromium happy path
  # through the real stack (scratch-DB backend + Vite dev server).
  frontend-e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Create the backend venv the Playwright config launches
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the smoke
        working-directory: frontend
        run: npx playwright test
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # Desktop shell (pywebview/pyobjc need macOS): access gate, dialog filters,
  # PATH handling, quit cleanup. The desktop-app job below builds the .app.
  desktop-shell:
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop/requirements.txt
      - name: Install backend + desktop dependencies
        run: pip install -r backend/requirements.txt -r desktop/requirements.txt
      - name: Desktop shell tests
        run: python -m pytest desktop/tests -q

  # Roadmap #32: build CRE Underwriting.app exactly as desktop/build_mac.sh
  # does locally (shell tests, frontend, PyInstaller, then the frozen
  # self-test) and keep the zip for a week. On pull requests and main only:
  # it takes several minutes on a macOS runner.
  desktop-app:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create the desktop venv the build script expects
        run: |
          python -m venv desktop/.venv
          desktop/.venv/bin/pip install -r backend/requirements.txt -r desktop/requirements.txt
      - name: Build the app and run its self-test
        run: ./desktop/build_mac.sh
      - name: Upload the zipped app
        uses: actions/upload-artifact@v4
        with:
          name: CRE-Underwriting-mac
          path: desktop/dist/CRE-Underwriting-mac.zip
          retention-days: 7
